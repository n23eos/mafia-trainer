<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Mafia-tool · Экран игроков</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1e17;color:#f5ecd7;font:20px system-ui;text-align:center;padding:4vh 4vw}main{max-width:1200px;margin:auto}h1{font-size:clamp(24px,4vw,60px)}#timer{display:block;font-size:clamp(90px,24vw,300px);font-variant-numeric:tabular-nums;color:#dfbe79;line-height:1.2}#speaker{font-size:clamp(22px,5vw,68px);overflow-wrap:anywhere}button{background:#dfbe79;color:#14231b;border:0;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}#connection{font-size:14px;color:#c4c9c3}#candidates{line-height:1.6;overflow-wrap:anywhere}</style></head><body><main><h1 id="phase">Экран для игроков</h1><p id="speaker">Ожидаем пульт ведущего</p><output id="timer">--:--</output><p id="candidates"></p><p id="result"></p><button id="fullscreen">На весь экран</button><p id="connection" role="status"></p></main><script>
(()=>{let last=0,lang='ru';const el=id=>document.getElementById(id),t=(ru,en)=>lang==='en'?en:ru;function show(data){if(data?.type!=='mafia-public-screen-v1'||!Number.isFinite(data.remaining)||!Array.isArray(data.candidates))return;lang=data.lang==='en'?'en':'ru';document.documentElement.lang=lang;last=Date.now();el('phase').textContent=t('День ','Day ')+data.round+' · '+data.phase;el('speaker').textContent=data.speaker?'№'+data.speaker.seat+' '+data.speaker.name:'';el('timer').textContent=data.phase===t('Ночь','Night')?'':Math.floor(data.remaining/60)+':'+String(data.remaining%60).padStart(2,'0');el('candidates').textContent=data.candidates.length?t('Кандидаты: ','Candidates: ')+data.candidates.map(p=>'№'+p.seat+(p.name?' '+p.name:'')).join(' · '):'';el('result').textContent=data.winner==='red'?t('Победа красных','Red team wins'):data.winner==='black'?t('Победа черных','Black team wins'):'';el('fullscreen').textContent=t('На весь экран','Fullscreen');el('connection').textContent=t('Данные поступают из пульта на этом устройстве.','Receiving updates from the host on this device.');}
window.addEventListener('message',e=>{if(e.source!==window.opener||e.origin!==location.origin)return;show(e.data);});window.opener?.postMessage('mafia-public-ready',location.origin==='null'?'*':location.origin);el('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{el('connection').textContent=t('Полный экран недоступен. Разверните окно вручную.','Fullscreen unavailable. Maximize the window manually.');}};setInterval(()=>{if(!last||Date.now()-last>5000){el('connection').textContent=t('Нет связи с пультом. Откройте вкладку ведущего.','No connection. Open the host tab.');el('timer').textContent='--:--';}},1500);
})();</script></body></html>
